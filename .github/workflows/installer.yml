name: Windows installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: ["claude/bold-knuth-wbixh5", "main"]
    paths:
      - "src/**"
      - "packaging/**"
      - "pyproject.toml"
      - ".github/workflows/installer.yml"

permissions:
  contents: write  # to attach the installer to a GitHub Release on version tags

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install . "pyinstaller>=6.10"
      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(python -c 'import analisis_acciones; print(analisis_acciones.__version__)')" >> "$GITHUB_OUTPUT"
      - name: Build application (PyInstaller)
        run: pyinstaller packaging/analisis_acciones.spec --noconfirm
      - name: Smoke test packaged app
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          ANALISIS_ACCIONES_HOME: ${{ runner.temp }}\smoke-home
        run: |
          $p = Start-Process -FilePath "dist\AnalisisAcciones\AnalisisAcciones.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          Get-Content "$env:ANALISIS_ACCIONES_HOME\logs\analisis_acciones.log" -ErrorAction SilentlyContinue | Select-Object -Last 20
          if ($p.ExitCode -ne 0) { throw "Smoke test failed with exit code $($p.ExitCode)" }
      - name: Install Inno Setup if missing
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnalisisAcciones-${{ steps.version.outputs.version }}-setup
          path: dist/installer/*.exe
          if-no-files-found: error
      - name: Attach to GitHub Release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/installer/*.exe
