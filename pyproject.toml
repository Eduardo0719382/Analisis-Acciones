[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "analisis-acciones"
version = "0.1.0"
description = "Aplicación de escritorio para análisis técnico de acciones."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "PySide6>=6.8,<6.13",
    "platformdirs>=4.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "yfinance>=0.2.54",
    "tzdata>=2024.1",  # time-zone database for zoneinfo on Windows
    "keyring>=25",  # API keys of optional data sources in the OS credential store
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
]

[project.scripts]
analisis-acciones = "analisis_acciones.app.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/analisis_acciones"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
addopts = "-ra -m 'not live'"
markers = [
    "live: calls real external services; run with: pytest -m live",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Typographic characters used on purpose in Spanish user-facing text.
allowed-confusables = ["×", "−", "–", "σ", "μ"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["analisis_acciones"]
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["yfinance", "yfinance.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["analisis_acciones.ui.*", "analisis_acciones.app.*"]
# Qt signal/slot and widget APIs are loosely typed in PySide6 stubs.
disallow_untyped_calls = false
